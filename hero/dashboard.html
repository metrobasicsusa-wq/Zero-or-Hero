<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zero-or-Hero 监控</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --up: #006300;
  --down: #d03b3b;
  --chip: #f0efec;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --series-2: #d95926;
    --up: #0ca30c;
    --down: #e66767;
    --chip: #383835;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255,255,255,0.10);
  --series-1: #3987e5;
  --series-2: #d95926;
  --up: #0ca30c;
  --down: #e66767;
  --chip: #383835;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 20px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
h1 span { color: var(--muted); font-weight: 500; }
h2 { font-size: 15px; margin: 0 0 12px; }
.meta { color: var(--ink-2); font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.kpi .label { color: var(--ink-2); font-size: 12px; }
.kpi .value { font-size: 24px; font-weight: 600; margin-top: 2px; }
.kpi .sub { font-size: 12px; margin-top: 2px; color: var(--ink-2); }
.up { color: var(--up); }
.down { color: var(--down); }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
.legend i { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 6px; border-radius: 1px; }
.chart-wrap { position: relative; }
svg { display: block; width: 100%; height: auto; }
.tooltip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  white-space: nowrap; display: none;
}
.tooltip b { display: block; margin-bottom: 2px; }
.tooltip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
.table-wrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td:has(.why) { white-space: normal; min-width: 280px; color: var(--ink-2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--chip); font-size: 12px; color: var(--ink-2); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
.grid2 .card { margin-bottom: 0; }
/* A card beside a taller one: its scrolling text fills the height the row gives it. */
.card.fill { display: flex; flex-direction: column; }
.card.fill > div { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.card.fill pre { flex: 1 1 0; min-height: 320px; max-height: none; }
a { color: var(--series-1); }
.params { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-size: 13px; }
.params dt { color: var(--ink-2); }
.params dd { margin: 0; font-variant-numeric: tabular-nums; }
pre { white-space: pre-wrap; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; color: var(--ink-2); max-height: 320px; overflow: auto; }
footer { color: var(--muted); font-size: 12px; margin-top: 24px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Zero-or-Hero <span id="exp-name">· Claude</span></h1>
    <nav class="meta" id="exp-nav"></nav>
    <div class="meta" id="updated"></div>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="card">
    <h2>累计收益 vs SPY</h2>
    <div class="legend" id="legend"></div>
    <div class="chart-wrap" id="chart"></div>
  </section>

  <section class="card" id="review-card">
    <h2>最新复盘</h2>
    <div id="review"></div>
  </section>

  <section class="grid2">
    <div class="card">
      <h2>宏观指标</h2>
      <div id="macro"></div>
    </div>
    <div class="card fill">
      <h2>盘前宏观简报（AI，只记录）</h2>
      <div id="briefing"></div>
    </div>
  </section>

  <section class="card" id="zdte-card" hidden>
    <h2>末日阶段（0DTE）</h2>
    <div id="zdte"></div>
  </section>

  <section class="card">
    <h2>当前持仓</h2>
    <div id="positions"></div>
  </section>

  <section class="card">
    <h2>挂单与止损单</h2>
    <div id="orders"></div>
  </section>

  <section class="card">
    <h2>交易记录 <span class="meta" id="events-note"></span></h2>
    <div id="events"></div>
  </section>

  <section class="grid2">
    <div class="card">
      <h2>当前参数</h2>
      <div id="params"></div>
    </div>
    <div class="card">
      <h2>进化日志</h2>
      <div id="evolution"></div>
    </div>
  </section>

  <footer>Alpaca 模拟盘 · 交易时段每 10 分钟更新，页面打开时自动刷新 · 数据来自仓库 journal/ 目录</footer>
</main>

<script>
const DATA = /*__DATA__*/null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = (x) => (x === null || x === undefined || x === "" ? null : Number(x));
const usd = (x, d = 0) => x === null ? "—" : (x < 0 ? "-$" : "$") + Math.abs(x).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
// Values that round to zero at the shown precision read as flat, never "-0.00%".
const flat = (x, d) => x === null || Math.abs(x * 100) < 0.5 * Math.pow(10, -d) ? 0 : x;
const pct = (x, d = 2) => x === null || !isFinite(x) ? "—" : (flat(x, d) > 0 ? "+" : "") + (flat(x, d) * 100).toFixed(d) + "%";
const ptone = (x, d = 2) => tone(flat(x, d)), parrow = (x, d = 2) => arrow(flat(x, d));
const tone = (x) => x > 0 ? "up" : x < 0 ? "down" : "";
const arrow = (x) => x > 0 ? "▲ " : x < 0 ? "▼ " : "";
const fmtTime = (ts) => new Date(ts).toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });

function optionLabel(sym) {
  if (sym.length <= 15) return null;
  const t = sym.slice(-15);
  const strike = Number(t.slice(7)) / 1000;
  return `${sym.slice(0, -15)} ${t.slice(2, 4)}/${t.slice(4, 6)} ${t[6] === "C" ? "看涨" : "看跌"} ${strike}`;
}

function empty(msg) { return `<div class="empty">${esc(msg)}</div>`; }

const EXPERIMENTS = [["Claude 主实验 $100k", "index.html"], ["Claude-500 子实验", "s500.html"]];

function renderNav() {
  const name = DATA.config.name || "Claude";
  $("exp-name").textContent = "· " + name;
  document.title = `Zero-or-Hero · ${name}`;
  const here = location.pathname.split("/").pop() || "index.html";
  $("exp-nav").innerHTML = EXPERIMENTS.map(([label, href]) =>
    href === here ? `<b>${esc(label)}</b>` : `<a href="${href}">${esc(label)}</a>`).join(" · ");
}

function renderHeader() {
  const ts = DATA.snapshot?.ts || DATA.generated;
  const mins = Math.max(0, Math.round((Date.now() - new Date(ts)) / 60000));
  const ago = mins < 1 ? "刚刚" : mins < 60 ? `${mins} 分钟前` : `${Math.floor(mins / 60)} 小时前`;
  $("updated").textContent = `数据更新于 ${new Date(ts).toLocaleString("zh-CN")}（${ago}）`;
}

// The page is regenerated after every trading cycle. Poll for a newer build once a minute,
// bypassing the browser and Pages caches, and reload when one is published.
function watchForUpdates() {
  setInterval(async () => {
    renderHeader();
    try {
      const res = await fetch(location.pathname + "?t=" + Date.now(), { cache: "no-store" });
      const m = (await res.text()).match(/"generated":"([^"]+)"/);
      if (m && m[1] !== DATA.generated) location.replace(location.pathname + "?t=" + Date.now());
    } catch (e) { /* offline: try again next minute */ }
  }, 60000);
}

function renderKpis() {
  const a = DATA.snapshot?.account;
  const eq = DATA.equity.map((r) => ({ ...r, equity: num(r.equity), benchmark: num(r.benchmark) }));
  const equity = a ? num(a.equity) : eq.at(-1)?.equity ?? null;
  const start = eq[0]?.equity ?? null;
  const total = equity !== null && start ? equity / start - 1 : null;
  const dayPl = a ? num(a.equity) - num(a.last_equity) : null;
  const dayPct = a && num(a.last_equity) ? dayPl / num(a.last_equity) : null;
  const b0 = eq.find((r) => r.benchmark)?.benchmark, b1 = [...eq].reverse().find((r) => r.benchmark)?.benchmark;
  const spy = b0 && b1 ? b1 / b0 - 1 : null;
  const excess = total !== null && spy !== null ? total - spy : null;
  const positions = DATA.snapshot?.positions || [];
  const opts = positions.filter((p) => p.asset_class === "us_option").length;

  const tiles = [
    ["账户净值", usd(equity), a ? `现金 ${usd(num(a.cash))}` : ""],
    ["累计收益", `<span class="${ptone(total)}">${parrow(total)}${pct(total)}</span>`, start ? `起始 ${usd(start)}` : "数据积累中"],
    ["今日盈亏", `<span class="${tone(dayPl)}">${arrow(dayPl)}${usd(dayPl)}</span>`, pct(dayPct)],
    ["跑赢 SPY", `<span class="${ptone(excess)}">${parrow(excess)}${pct(excess)}</span>`, spy === null ? "数据积累中" : `SPY ${pct(spy)}`],
    ["持仓", String(positions.length), `股票 ${positions.length - opts} · 期权 ${opts}`],
    ["参数代数", "第 " + DATA.config.generation + " 代", "每周六进化"],
  ];
  $("kpis").innerHTML = tiles.map(([l, v, s]) =>
    `<div class="kpi"><div class="label">${l}</div><div class="value">${v}</div><div class="sub">${s}</div></div>`).join("");
}

function niceTicks(lo, hi, n = 5) {
  const span = hi - lo || 0.01;
  const raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw);
  const ticks = [];
  const top = Math.ceil(hi / step - 1e-9) * step;
  for (let v = Math.floor(lo / step + 1e-9) * step; v <= top + step * 1e-9; v += step) ticks.push(+v.toFixed(10));
  return ticks;
}

function renderChart() {
  const rows = DATA.equity.filter((r) => num(r.equity));
  const legend = [["Claude", "--series-1"], ["SPY", "--series-2"]];
  $("legend").innerHTML = legend.map(([n, c]) => `<span><i style="background:var(${c})"></i>${n}</span>`).join("");
  if (rows.length < 2) {
    $("chart").innerHTML = empty("至少需要两个交易日的数据才能画出曲线，先让机器人跑几天。");
    return;
  }
  const e0 = num(rows[0].equity);
  const bIdx = rows.findIndex((r) => num(r.benchmark));
  const b0 = bIdx >= 0 ? num(rows[bIdx].benchmark) : null;
  const series = [
    { name: "Claude", color: "--series-1", vals: rows.map((r) => num(r.equity) / e0 - 1) },
    { name: "SPY", color: "--series-2", vals: rows.map((r) => b0 && num(r.benchmark) ? num(r.benchmark) / b0 - 1 : null) },
  ];
  const all = series.flatMap((s) => s.vals).filter((v) => v !== null).concat([0]);
  const ticks = niceTicks(Math.min(...all), Math.max(...all));
  const lo = ticks[0], hi = ticks.at(-1);
  const tickDec = ticks.every((t) => Math.abs(t * 100 - Math.round(t * 100)) < 1e-6) ? 0 : 1;

  // Draw at the container's real pixel width so text stays legible on phones.
  const W = Math.max(300, $("chart").clientWidth), H = Math.round(Math.min(320, Math.max(220, W * 0.45)));
  const L = 60, R = W < 500 ? 96 : 104, T = 12, B = 28;
  const x = (i) => L + (i / (rows.length - 1)) * (W - L - R);
  const y = (v) => T + (1 - (v - lo) / (hi - lo || 1)) * (H - T - B);
  const path = (vals) => vals.map((v, i) => v === null ? null : `${x(i).toFixed(1)},${y(v).toFixed(1)}`)
    .reduce((acc, p) => { if (!p) { acc.push([]); } else acc.at(-1).push(p); return acc; }, [[]])
    .filter((seg) => seg.length).map((seg) => "M" + seg.join("L")).join("");

  const nx = W < 500 ? 2 : 3;
  const xTickIdx = [...new Set(Array.from({ length: nx + 1 }, (_, k) => Math.round(k * (rows.length - 1) / nx)))];
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="累计收益曲线">`;
  for (const t of ticks) {
    svg += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(${t === 0 ? "--axis" : "--grid"})" stroke-width="1"/>`;
    svg += `<text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" font-size="12" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${pct(t, tickDec)}</text>`;
  }
  for (const i of xTickIdx) {
    svg += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="12" fill="var(--muted)">${rows[i].date.slice(5)}</text>`;
  }
  for (const s of series) {
    svg += `<path d="${path(s.vals)}" fill="none" stroke="var(${s.color})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li = s.vals.map((v, i) => v === null ? -1 : i).filter((i) => i >= 0).at(-1);
    if (li !== undefined) {
      svg += `<text x="${x(li) + 8}" y="${y(s.vals[li]) + 4}" font-size="12" fill="var(--ink-2)">${s.name} ${pct(s.vals[li], 1)}</text>`;
    }
  }
  svg += `<line id="xhair" y1="${T}" y2="${H - B}" stroke="var(--axis)" stroke-width="1" visibility="hidden"/>`;
  for (const s of series) svg += `<circle class="dot" r="4" fill="var(${s.color})" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`;
  svg += `<rect id="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/></svg><div class="tooltip" id="tip"></div>`;
  $("chart").innerHTML = svg;

  const el = $("chart").querySelector("svg"), tip = $("tip"), xh = el.querySelector("#xhair"), dots = el.querySelectorAll(".dot");
  const hide = () => { xh.setAttribute("visibility", "hidden"); dots.forEach((d) => d.setAttribute("visibility", "hidden")); tip.style.display = "none"; };
  el.querySelector("#hit").addEventListener("pointerleave", hide);
  el.querySelector("#hit").addEventListener("pointermove", (ev) => {
    const box = el.getBoundingClientRect(), sx = (ev.clientX - box.left) * (W / box.width);
    const i = Math.max(0, Math.min(rows.length - 1, Math.round((sx - L) / (W - L - R) * (rows.length - 1))));
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("visibility", "visible");
    series.forEach((s, k) => {
      const v = s.vals[i];
      dots[k].setAttribute("visibility", v === null ? "hidden" : "visible");
      if (v !== null) { dots[k].setAttribute("cx", x(i)); dots[k].setAttribute("cy", y(v)); }
    });
    tip.innerHTML = `<b>${rows[i].date}</b>` + series.map((s) =>
      `<div><i style="background:var(${s.color})"></i>${s.name} ${pct(s.vals[i])}</div>`).join("") +
      `<div style="color:var(--ink-2)">净值 ${usd(num(rows[i].equity))}</div>`;
    tip.style.display = "block";
    const px = x(i) / W * box.width, flip = px > box.width * 0.6;
    tip.style.left = (flip ? px - tip.offsetWidth - 12 : px + 12) + "px";
    tip.style.top = "8px";
  });
}

function table(headers, rows) {
  return `<div class="table-wrap"><table><thead><tr>${headers.map(([h, n]) => `<th class="${n ? "num" : ""}">${h}</th>`).join("")}</tr></thead><tbody>${
    rows.map((r) => `<tr>${r.map((c, i) => `<td class="${headers[i][1] ? "num" : ""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function renderPositions() {
  const ps = DATA.snapshot?.positions || [];
  if (!ps.length) { $("positions").innerHTML = empty(DATA.snapshot ? "目前空仓" : "还没有快照数据，等下一轮交易。"); return; }
  ps.sort((a, b) => num(b.market_value) - num(a.market_value));
  $("positions").innerHTML = table(
    [["标的"], ["类型"], ["数量", 1], ["成本", 1], ["现价", 1], ["市值", 1], ["浮动盈亏", 1], ["盈亏 %", 1]],
    ps.map((p) => {
      const opt = optionLabel(p.symbol), pl = num(p.unrealized_pl), plpc = num(p.unrealized_plpc);
      return [
        `<b>${esc(opt || p.symbol)}</b>`,
        `<span class="chip">${opt ? "期权" : "股票"}</span>`,
        esc(p.qty), usd(num(p.avg_entry_price), 2), usd(num(p.current_price), 2), usd(num(p.market_value)),
        `<span class="${tone(pl)}">${usd(pl)}</span>`, `<span class="${ptone(plpc, 1)}">${parrow(plpc, 1)}${pct(plpc, 1)}</span>`,
      ];
    }));
}

function renderOrders() {
  const os = DATA.snapshot?.open_orders || [];
  if (!os.length) { $("orders").innerHTML = empty("没有挂单"); return; }
  os.sort((a, b) => (a.protective_stop ? 1 : 0) - (b.protective_stop ? 1 : 0));
  $("orders").innerHTML = table(
    [["提交时间"], ["标的"], ["方向"], ["数量", 1], ["类型"], ["价格", 1]],
    os.map((o) => [fmtTime(o.submitted_at), `<b>${esc(optionLabel(o.symbol) || o.symbol)}</b>`,
      o.side === "buy" ? "买入" : "卖出", esc(o.qty),
      o.protective_stop ? '<span class="chip">保护性止损 · GTC</span>' : esc(o.type),
      o.stop_price ? "止损 " + usd(num(o.stop_price), 2) : o.limit_price ? usd(num(o.limit_price), 2) : "—"]));
}

function renderZdte() {
  const b = DATA.zdte, p = DATA.config.zero_dte;
  if (!b || !p || !p.enabled) return;
  $("zdte-card").hidden = false;
  const t = b.today, hist = (b.history || []).slice().reverse();
  const items = [
    ["阶段", b.phase === "zero_dte" ? "末日阶段（翻倍前）" : `已切换为动量策略（${b.switched}）`],
    ["起始资金", usd(b.start, 2)],
    ["切换线 / 归零线", `${usd(b.start * p.switch_at)} / ${usd(b.start * (1 - (DATA.config.attempt?.end_loss ?? 0.9)))}`],
    ["规则", `${p.underlying} ${p.entry} 买，离现价 ${(p.offset * 100).toFixed(1)}%，${p.direction === "trend" ? "顺势" : "只买看涨"}，${p.take} 倍止盈，每次用资金的 ${Math.round(p.fraction * 100)}%，${p.exit_at} 前平仓`],
  ];
  if (DATA.rehearsal) items.splice(1, 0, ["模拟现金", usd(b.sim_cash, 2)]);
  const row = (x) => [esc(x.date), `<b>${esc(optionLabel(x.symbol) || x.symbol)}</b>`,
    x.status === "skipped" ? '<span class="chip">跳过</span>' : x.status === "open" ? '<span class="chip">持有中</span>'
      : `<span class="chip">${esc(x.exit || "已平仓")}</span>`,
    esc(x.qty ?? ""), x.price !== undefined ? usd(x.price, 2) : "—", x.take_price !== undefined ? usd(x.take_price, 2) : "—",
    x.paid !== undefined ? usd(x.paid, 2) : "—", x.proceeds !== undefined ? usd(x.proceeds, 2) : "—",
    x.ret !== undefined ? `<span class="${tone(x.ret)}">${pct(x.ret, 0)}</span>` : "—"];
  const rows = [];
  if (t && t.status !== "closed") rows.push(row(t));
  hist.forEach((x) => rows.push(row(x)));
  $("zdte").innerHTML = `<dl class="params">${items.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` +
    (rows.length ? table([["日期"], ["合约"], ["状态"], ["张数", 1], ["买价", 1], ["止盈价", 1], ["花费", 1], ["收回", 1], ["收益", 1]], rows)
      : empty("还没有末日交易"));
}

function renderEvents() {
  const es = DATA.events;
  if (DATA.rehearsal) $("events-note").textContent = "· 演练中：以下都是模拟，没有真下单";
  if (!es.length) { $("events").innerHTML = empty("还没有交易"); return; }
  const kind = (e) => e.kind === "close" ? "平仓" : e.kind === "halt" ? "暂停开仓" : e.kind === "option_skip" ? "未买期权"
    : e.kind === "zdte_result" ? "末日结果" : e.kind === "zdte_skip" ? "末日跳过"
    : e.kind === "zdte_switch" ? "翻倍切换" : e.kind === "zdte_attempt_end" ? "本轮归零"
    : e.kind === "lottery_pick" ? "本周彩票" : e.kind === "lottery_skip" ? "彩票跳过" : e.kind === "lottery_result" ? "彩票结果"
    : e.kind === "circuit" ? "市场熔断" : e.kind === "news_alert" ? "新闻警报"
    : e.kind === "stock_drop_alert" ? "急跌警报" : e.kind === "buy_blocked" ? "暂停买入"
    : e.kind === "earnings_watch" ? "财报提醒" : e.kind === "attempt_end" ? "触及结束线" : e.kind === "attempt_end_confirmed" ? "本轮结束" : e.side === "buy" ? "买入" : "卖出";
  $("events").innerHTML = table(
    [["时间"], ["动作"], ["标的"], ["数量", 1], ["限价", 1], ["原因"]],
    es.slice(0, 60).map((e) => [fmtTime(e.ts), `<span class="chip">${e.dry_run ? "模拟" : ""}${kind(e)}</span>`,
      e.symbol ? `<b>${esc(optionLabel(e.symbol) || e.symbol)}</b>` : "—", esc(e.qty || ""),
      e.limit_price ? usd(num(e.limit_price), 2) : "—",
      `<span class="why">${esc(e.why || e.reason || (e.day_pl !== undefined ? "当日 " + pct(e.day_pl) : ""))}</span>`]));
}

function renderParams() {
  const c = DATA.config, s = c.stocks, o = c.options, r = c.risk;
  const items = [
    ["动量周期", s.momentum_lookback + " 天"], ["趋势均线", s.trend_sma + " 日"], ["持股数", s.top_n],
    ["RSI 过热时", s.rsi_applies_to_holdings === false ? "只限制买入，持有的不卖" : "持有的也卖出"],
    ["股票总仓位", pct(s.gross_exposure, 0)], ["期权预算", pct(o.allocation, 0) + ` · 最多 ${o.max_positions} 个`],
    ["期权止盈 / 止损", pct(o.take_profit, 0) + " / " + pct(o.stop_loss, 0)],
    ["单只上限", pct(r.max_position_pct, 0)], ["日亏损暂停", pct(r.daily_loss_halt, 0)],
    ["股票止损", `${r.stop_vol_mult} 倍日波动率，${Math.round(r.stop_min_pct * 100)}%–${Math.round(r.stop_max_pct * 100)}%，券商端 GTC`],
  ];
  if (DATA.targets) items.push(["最新选股", Object.keys(DATA.targets.weights).join("、") || "空仓"]);
  $("params").innerHTML = `<dl class="params">${items.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
}

function renderReview() {
  const r = DATA.review;
  if (!r) { $("review").innerHTML = empty("第一份复盘在今天收盘后生成"); return; }
  const items = r.points.map((p) => `<li>${esc(p)}</li>`).join("") || "<li>无</li>";
  $("review").innerHTML = `<div class="meta" style="margin-bottom:8px">${esc(r.title)} · ` +
    `${r.has_ai ? "含 AI 分析" : "AI 分析待生成（17:05 后）"} · <a href="${esc(r.url)}" target="_blank" rel="noopener">查看全文</a></div>` +
    `<ul style="margin:0;padding-left:20px">${items}</ul>`;
}

function renderMacro() {
  const m = DATA.macro;
  if (!m) { $("macro").innerHTML = empty("下一次调仓时开始记录") + renderMarket(); return; }
  const rows = Object.values(m.gauges).map((g) =>
    [g.flag ? `<span class="chip" style="color:var(--down)">警报</span>` : `<span class="chip">正常</span>`, esc(g.text)]);
  const mode = DATA.config.stocks.macro_scale < 1
    ? `两项及以上警报时股票仓位乘 ${Math.round(DATA.config.stocks.macro_scale * 100)}%` : "目前只记录，不影响仓位（由每周进化决定是否启用）";
  $("macro").innerHTML = `<div class="meta" style="margin-bottom:8px">${fmtTime(m.ts)} · ` +
    `${m.risk_off ? "避险信号" : "无避险信号"} · ${esc(mode)}</div>` + table([["状态"], ["读数"]], rows) + renderMarket();
}

function renderMarket() {
  const m = DATA.market;
  if (!m) return "";
  const held = new Set((DATA.snapshot?.positions || []).map((p) => p.symbol));
  const news = Object.entries(m.news || {}).sort((a, b) => (held.has(b[0]) - held.has(a[0])) || b[1].articles - a[1].articles)
    .slice(0, 8).map(([s, v]) => [`<b>${esc(s)}</b>${held.has(s) ? " · 持有" : ""}`, esc(v.label),
      String(v.articles), `<span class="why">${esc((v.top[0] || {}).title || "")}</span>`]);
  return `<div class="meta" style="margin:12px 0 6px">真实数据（Alpha Vantage，${fmtTime(m.fetched_at)}，只记录）</div>` +
    `<ul style="margin:0 0 8px;padding-left:20px">${m.lines.map((l) => `<li>${esc(l)}</li>`).join("")}</ul>` +
    (news.length ? `<div class="meta" style="margin:8px 0 6px">过去 24 小时新闻情绪</div>` +
      table([["标的"], ["情绪"], ["篇数", 1], ["最相关标题"]], news) : "");
}

function renderBriefing() {
  const b = DATA.briefing;
  if (!b) { $("briefing").innerHTML = empty("每个交易日 9:00（美东）生成"); return; }
  $("briefing").innerHTML = `<div class="meta" style="margin-bottom:8px">${esc(b.date)} · ` +
    `<a href="${esc(b.url)}" target="_blank" rel="noopener">查看全文</a></div><pre>${esc(b.text)}</pre>`;
}

function renderEvolution() {
  const text = DATA.evolution.replace(/^# Evolution log\s*/, "").trim();
  $("evolution").innerHTML = text ? `<pre>${esc(text)}</pre>` : empty("第一次进化在本周六");
}

renderNav();
renderHeader();
renderKpis();
renderChart();
let lastW = $("chart").clientWidth;
new ResizeObserver(() => { const w = $("chart").clientWidth; if (w !== lastW) { lastW = w; renderChart(); } }).observe($("chart"));
renderPositions();
renderOrders();
renderZdte();
renderEvents();
renderParams();
renderEvolution();
renderReview();
renderMacro();
renderBriefing();
watchForUpdates();
</script>
</body>
</html>
