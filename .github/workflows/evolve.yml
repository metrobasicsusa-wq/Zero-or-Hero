name: evolve

on:
  # Scheduled by cron-job.org via the workflow_dispatch API (GitHub's cron was unreliable).
  workflow_dispatch:

concurrency:
  group: hero-journal
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # latest head, not the commit current when this run was queued
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Evolve
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m hero evolve
      - name: Commit new generation
        run: |
          git config user.name "zero-or-hero-bot"
          git config user.email "zero-or-hero-bot@users.noreply.github.com"
          git add config journal
          git diff --cached --quiet || (git commit -m "evolve: weekly parameter search $(date -u +%F)" && git pull --rebase && git push)

  pages:
    needs: evolve
    if: always()
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
