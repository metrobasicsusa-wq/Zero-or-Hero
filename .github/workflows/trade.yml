name: trade

on:
  # Triggered every 10 minutes in market hours by an external scheduler (cron-job.org)
  # calling the workflow_dispatch API; GitHub's own cron proved too unreliable.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log orders without sending them"
        type: boolean
        default: false

concurrency:
  group: hero-journal
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # latest head, not the commit current when this run was queued
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Dynamic universe (rebuilt once per ET month)
        continue-on-error: true   # without it the experiment keeps last month's pool or its static list
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_S500_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_S500_SECRET_KEY }}
        run: python -m hero universe --size 100
      - name: Earnings calendar (one Alpha Vantage call per ET day at most)
        continue-on-error: true   # without it, the earnings guard simply blocks short-dated options
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python -m hero earnings
      - name: Market context (yields and oil from Alpha Vantage, news from Alpaca; record only, once per ET day)
        continue-on-error: true
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m hero market
      - name: Trade
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m hero run ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Trade Claude-500
        # Separate $500 paper account. A failure here must not stop the main journal from being saved.
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_S500_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_S500_SECRET_KEY }}
        run: python -m hero --config config/s500.json --journal journal-s500 run ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Notify Discord
        # One-way push of fills, exits, results and errors since the last cycle; does nothing without DC_WEBHOOK.
        continue-on-error: true
        env:
          DC_WEBHOOK: ${{ secrets.DC_WEBHOOK }}
        run: python -m hero.notify journal journal-s500
      - name: Commit journal
        run: |
          git config user.name "zero-or-hero-bot"
          git config user.email "zero-or-hero-bot@users.noreply.github.com"
          git add journal journal-s500 data
          git diff --cached --quiet && exit 0
          git commit -m "journal: trading cycle $(date -u +%FT%TZ)"
          # A lost push loses this cycle's journal (the sleeves rebuild their tickets from the broker next cycle): retry.
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1

  pages:
    needs: run
    if: always()
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
