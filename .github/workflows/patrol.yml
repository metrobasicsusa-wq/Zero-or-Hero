name: patrol

on:
  # Scheduled by cron-job.org via the workflow_dispatch API (GitHub's cron was unreliable).
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  patrol:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1   # one experiment at a time: both commit to the same branch
      fail-fast: false
      matrix:
        exp:
          - {name: Claude, args: "", journal: journal, exchange: exchange/claude, key: ALPACA_API_KEY, secret: ALPACA_SECRET_KEY}
          - {name: Claude-500, args: "--config config/s500.json --journal journal-s500 --exchange exchange/claude/s500", journal: journal-s500, exchange: exchange/claude/s500, key: ALPACA_S500_API_KEY, secret: ALPACA_S500_SECRET_KEY}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # latest head, not the commit current when this run was queued
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check health
        env:
          ALPACA_API_KEY: ${{ secrets[matrix.exp.key] }}
          ALPACA_SECRET_KEY: ${{ secrets[matrix.exp.secret] }}
        run: python -m hero ${{ matrix.exp.args }} patrol | tee problems.txt
      - name: Raise an alert issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s problems.txt ] || exit 0
          body="$(date -u +'%F %H:%M UTC') ${{ matrix.exp.name }} 巡检发现问题："$'\n\n'"$(sed 's/^/- /' problems.txt)"
          # Keep one open alert issue and append to it instead of opening a new one each time.
          num=$(gh issue list --state open --label patrol-alert --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh label create patrol-alert --color d93f0b --description "Automated health alert" 2>/dev/null || true
            gh issue create --title "⚠️ 巡检告警（Claude 机器人）" --label patrol-alert --body "$body"
          fi
