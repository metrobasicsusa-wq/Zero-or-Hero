name: review

on:
  # Scheduled by cron-job.org via the workflow_dispatch API (GitHub's cron was unreliable).
  workflow_dispatch:
    inputs:
      date:
        description: "Trading day (YYYY-MM-DD, ET); defaults to today"
        required: false

concurrency:
  group: hero-journal
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # latest head, not the commit current when this run was queued
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Decide whether to write
        id: gate
        run: |
          day="${{ inputs.date }}"
          [ -n "$day" ] || day=$(TZ=America/New_York date +%F)
          echo "day=$day" >> "$GITHUB_OUTPUT"
          f="journal/reviews/$day.md"
          if [ -z "${{ inputs.date }}" ] && [ "$(TZ=America/New_York date +%H%M)" -lt 1605 ]; then
            echo "before the close (EST schedule slot); skipping"; exit 0
          fi
          if [ -f "$f" ] && grep -q "^## AI 分析" "$f"; then echo "AI analysis already appended; leaving it"; exit 0; fi
          if [ -f "$f" ] && head -1 "$f" | grep -q "^# 盘后复盘"; then echo "final review already written"; exit 0; fi
          echo "go=1" >> "$GITHUB_OUTPUT"
      - name: Refresh broker snapshot and fills
        if: steps.gate.outputs.go
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m hero snapshot
      - name: Write review
        id: write
        if: steps.gate.outputs.go
        run: |
          out=$(python -m hero review --write --date "${{ steps.gate.outputs.day }}")
          echo "$out"
          case "$out" in NO_TRADING_DAY*) exit 0;; esac
          echo "file=$(echo "$out" | head -1)" >> "$GITHUB_OUTPUT"
          echo "status=$(echo "$out" | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Commit and publish issue
        if: steps.write.outputs.file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day="${{ steps.gate.outputs.day }}"
          git config user.name "zero-or-hero-bot"
          git config user.email "zero-or-hero-bot@users.noreply.github.com"
          git add journal exchange/claude
          git diff --cached --quiet || (git commit -m "review: post-market $day (${{ steps.write.outputs.status }})" && git pull --rebase && git push)
          title="盘后复盘 $day（Claude）"
          num=$(gh issue list --state all --label post-market --search "$title in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file "${{ steps.write.outputs.file }}"
            gh issue comment "$num" --body "已用 $(TZ=America/New_York date +'%H:%M') ET 的券商快照重新生成（${{ steps.write.outputs.status }}），正文已更新。"
          else
            gh label create post-market --color 0e8a16 --description "Daily post-market review" 2>/dev/null || true
            gh issue create --title "$title" --label post-market --body-file "${{ steps.write.outputs.file }}"
          fi

  pages:
    needs: review
    if: always()
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
