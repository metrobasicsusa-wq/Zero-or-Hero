name: research

# Research backtests on real Alpaca daily bars (market data only, never trades). Results are
# committed to research/.
on:
  workflow_dispatch:
    inputs:
      study:
        description: "Which study to run"
        type: choice
        options: [short, universe, s500, earnings, lottery, flow, 0dte, events, fly, tails, seller, net, gap, ironfly, today, flush, flush_stock, 0dte_names, weekly, weekly_news, lotto0dte, letf, reclaim, zdte_filter, plan_review, streak]
        default: short

# Its own queue per study: a long study must never hold up the trading runs (which share hero-journal),
# nor a quick one (today) wait behind a long one.
# It only commits under research/ and rebases before pushing.
concurrency:
  group: hero-research-${{ inputs.study }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run study
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python -m hero.research_${{ inputs.study }}
      - name: Commit results
        run: |
          git config user.name "zero-or-hero-bot"
          git config user.email "zero-or-hero-bot@users.noreply.github.com"
          git add research
          git diff --cached --quiet && exit 0
          git commit -m "research: ${{ inputs.study }} backtest $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
