name: notify-test

# Sends one line to the Discord webhook in DC_WEBHOOK, to check the connection.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Send a test message
        env:
          DC_WEBHOOK: ${{ secrets.DC_WEBHOOK }}
        run: python -m hero.notify --test
